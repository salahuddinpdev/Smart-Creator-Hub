    <!-- Organization JSON-LD (static, always present) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SmartCreatorTools",
      "url": "https://smartcreatortools.com",
      "logo": "https://smartcreatortools.com/favicon.svg",
      "description": "Free, fast, no-signup online tools for creators, students, and developers.",
      "sameAs": [
        "https://twitter.com/SmartCreatorTools",
        "https://github.com/SmartCreatorTools"
      ],

        "@type": "ContactPoint",
        "contactType": "customer support",

      }

    <!-- WebSite + SearchAction JSON-LD (static) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SmartCreatorTools",
      "url": "https://smartcreatortools.com",
      "description": "20+ free online tools for creators, students, and developers. No signup, runs in your browser.",

      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://smartcreatortools.com/tools?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
